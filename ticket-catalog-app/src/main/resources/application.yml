spring:
  config:
    name: ticket-catalog-app
  profiles:
    active: dev

# Apollo 配置中心。Nacos 仍只做 Dubbo 注册。
# AppId 用数字字符串，必须和 Portal 创建项目时填写的 AppId 一致。
app:
  id: "100000001"
apollo:
  meta: http://127.0.0.1:8082
  # 跳过 Eureka，直连宿主机映射端口。不配的话客户端会去访问 apollo-configservice:8080。
  configService: http://127.0.0.1:8082
  bootstrap:
    enabled: true
    eagerLoad:
      enabled: true
    namespaces: application
